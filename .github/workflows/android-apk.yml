name: Android APK

on:
  push:
    branches: [moonlight-noir]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; just add the pinned NDK.
      - name: Install NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
