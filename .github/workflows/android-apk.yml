name: Android APK

on:
  push:
    branches: [moonlight-noir]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; just add the pinned NDK.
      - name: Install NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Downloadable straight from a phone: github.com/<owner>/moonlight-android/releases
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          SHORT_SHA=${GITHUB_SHA::7}
          cp "$APK" "artemis-cloud-debug-${SHORT_SHA}.apk"
          gh release create "build-${GITHUB_RUN_NUMBER}" "artemis-cloud-debug-${SHORT_SHA}.apk" \
            --target "$GITHUB_SHA" \
            --title "Debug build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Debug APK built from ${SHORT_SHA}. Installs alongside official Artemis (app id com.limelight.noirdebug)." \
            --latest
